name: BBK Android Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-release.yml'

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable

      - name: Prepare Android SDK and CI signing
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/bbk-release.jks" \
            -storepass bbk-ci-release \
            -keypass bbk-ci-release \
            -alias bbk-ci-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=BBK CI Release, OU=BBK, O=BBK, L=Shanghai, ST=Shanghai, C=CN"
          {
            echo "BBK_RELEASE_KEY_ALIAS=bbk-ci-release"
            echo "BBK_RELEASE_KEY_PASSWORD=bbk-ci-release"
            echo "BBK_RELEASE_STORE_PASSWORD=bbk-ci-release"
            echo "BBK_RELEASE_STORE_FILE=$RUNNER_TEMP/bbk-release.jks"
          } >> "$GITHUB_ENV"

      - name: Validate Flutter and 三国霸业 enhancements
        run: |
          flutter pub get
          node tool/test_sgby_enhancements.mjs
          flutter analyze --no-pub
          flutter test --no-pub

      - name: Build Android release APK
        run: |
          flutter build apk --release --build-number="$GITHUB_RUN_NUMBER"
          mkdir -p build/release
          cp build/app/outputs/flutter-apk/app-release.apk \
            "build/release/BBK-android-release-${GITHUB_SHA::7}.apk"
          apksigner verify --verbose "build/release/BBK-android-release-${GITHUB_SHA::7}.apk"
          sha256sum "build/release/BBK-android-release-${GITHUB_SHA::7}.apk" \
            > "build/release/BBK-android-release-${GITHUB_SHA::7}.apk.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: bbk-android-release
          path: build/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
