name: BBK Android Release APK
on:
  workflow_dispatch:
    inputs:
      runtime_test:
        description: 额外构建 Debug 验证包
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      platform: android
      runtime_test: ${{ inputs.runtime_test }}
    secrets: inherit
