name: 三国霸业 Flutter 三平台打包

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 打包平台
        type: choice
        default: all
        options: [all, android, macos, ios]
  push:
    branches: [main, codex/sgby-flutter-packages]

permissions:
  contents: read

concurrency:
  group: sgby-packages-${{ github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: true

env:
  PUB_HOSTED_URL: https://pub.dev

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Flutter 3.44.4
        run: |
          git clone --depth 1 --branch 3.44.4 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --reporter expanded

  android:
    needs: validate
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'android' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare pinned Flutter and Android tools
        run: |
          git clone --depth 1 --branch 3.44.4 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: sgby-test-signing-v1
      - run: flutter pub get --enforce-lockfile
      - name: Build Android Release
        run: |
          mkdir -p build/ci-logs
          flutter build apk --release --no-pub --build-number=${{ github.run_number }} 2>&1 | tee build/ci-logs/android.log
      - run: bash tool/package_android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sgby-android
          path: dist/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sgby-android-diagnostics
          path: build/ci-logs/
          if-no-files-found: ignore
          retention-days: 7

  macos:
    needs: validate
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'macos' }}
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Flutter 3.44.4
        run: |
          git clone --depth 1 --branch 3.44.4 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
      - name: Build macOS Release
        run: |
          mkdir -p build/ci-logs
          flutter build macos --release --no-pub --build-number=${{ github.run_number }} 2>&1 | tee build/ci-logs/macos.log
      - run: bash tool/package_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sgby-macos
          path: dist/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sgby-macos-diagnostics
          path: build/ci-logs/
          if-no-files-found: ignore
          retention-days: 7

  ios:
    needs: validate
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'ios' }}
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Flutter 3.44.4
        run: |
          git clone --depth 1 --branch 3.44.4 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
      - name: Build unsigned iOS Release
        run: |
          mkdir -p build/ci-logs
          flutter build ios --release --no-codesign --no-pub --build-number=${{ github.run_number }} 2>&1 | tee build/ci-logs/ios.log
      - run: bash tool/package_ios_unsigned.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sgby-ios-unsigned
          path: dist/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sgby-ios-diagnostics
          path: build/ci-logs/
          if-no-files-found: ignore
          retention-days: 7
