name: BBK four-platform beta
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 需要打包的平台
        type: choice
        default: all
        options: [all, macos-android, android, ios, macos, windows]
permissions:
  contents: write
jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ inputs.platform }}
    secrets: inherit
