name: BBK four-platform beta

on:
  workflow_dispatch:
    inputs:
      platform:
        description: '需要打包的平台'
        type: choice
        default: all
        options: [all, android, ios, macos, windows]
  push:
    branches: [main]
    paths:
      - '.github/workflows/beta-packages.yml'
      - 'android/**'
      - 'ios/**'
      - 'macos/**'
      - 'windows/**'
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.*'
      - 'tool/package_*'

permissions:
  contents: read
concurrency:
  group: beta-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: "(github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'android') && !contains(github.event.head_commit.message, '[macos-only]') && !contains(github.event.head_commit.message, '[windows-only]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"'
      - run: flutter pub get
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - run: mkdir -p build/beta && cp build/app/outputs/flutter-apk/app-release.apk build/beta/BBK-android-beta.apk
      - uses: actions/upload-artifact@v4
        with:
          name: bbk-beta-android
          path: build/beta/BBK-android-beta.apk
          retention-days: 14
          compression-level: 0
  ios:
    if: "(github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'ios') && !contains(github.event.head_commit.message, '[macos-only]') && !contains(github.event.head_commit.message, '[windows-only]')"
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
      - run: bash tool/package_ios_unsigned.sh
      - run: mkdir -p build/beta && cp build/ipa/bbk-unsigned.ipa build/beta/BBK-ios-unsigned-beta.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: bbk-beta-ios
          path: build/beta/BBK-ios-unsigned-beta.ipa
          retention-days: 14
          compression-level: 0
  macos:
    if: "(github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos') && !contains(github.event.head_commit.message, '[windows-only]')"
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
      - run: flutter pub get
      - run: flutter build macos --release --build-number=${{ github.run_number }}
      - run: bash tool/package_macos_beta.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bbk-beta-macos
          path: build/beta/BBK-macos-beta.dmg
          retention-days: 14
          compression-level: 0
  windows:
    if: "(github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows') && !contains(github.event.head_commit.message, '[macos-only]')"
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
      - run: flutter pub get
      - run: flutter build windows --release --build-number=${{ github.run_number }}
      - shell: pwsh
        run: ./tool/package_windows_beta.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: bbk-beta-windows
          path: build/beta/BBK-windows-x64-portable-beta.zip
          retention-days: 14
          compression-level: 0
