name: iOS unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      PUB_HOSTED_URL: https://pub.dev
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Flutter SDK
        run: |
          git clone --depth 1 --branch 3.44.4 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Prepare iOS dependencies
        run: |
          flutter --version
          xcodebuild -version
          flutter precache --ios
          flutter pub get
      - name: Validate Flutter code
        run: |
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Build unsigned device app
        run: |
          mkdir -p build/ios-logs
          flutter build ios --release --no-codesign --build-number="$GITHUB_RUN_NUMBER" 2>&1 | tee build/ios-logs/build.log
      - name: Package unsigned IPA
        run: bash tool/package_ios_unsigned.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bbk-ios-unsigned
          path: |
            build/ipa/bbk-unsigned.ipa
            build/ipa/bbk-unsigned.ipa.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_tag="ios-unsigned"
          # Release 里放一个更友好的文件名
          cp build/ipa/bbk-unsigned.ipa build/ipa/BBK-iOS-unsigned.ipa
          cp build/ipa/bbk-unsigned.ipa.sha256 build/ipa/BBK-iOS-unsigned.ipa.sha256
          if ! gh release view "$release_tag" >/dev/null 2>&1; then
            gh release create "$release_tag" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "BBK iOS unsigned · Build $GITHUB_RUN_NUMBER" \
              --notes "自动构建的未签名 IPA。下载后可自行重签名（如用 AltStore / Sideloadly / 自签证书）安装到设备。"
          else
            gh release edit "$release_tag" \
              --target "$GITHUB_SHA" \
              --title "BBK iOS unsigned · Build $GITHUB_RUN_NUMBER"
          fi
          gh release upload "$release_tag" \
            build/ipa/BBK-iOS-unsigned.ipa \
            build/ipa/BBK-iOS-unsigned.ipa.sha256 \
            --clobber
          echo "Release 地址: https://github.com/$GITHUB_REPOSITORY/releases/tag/$release_tag"
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-diagnostics
          path: build/ios-logs/
          if-no-files-found: ignore
          retention-days: 7
