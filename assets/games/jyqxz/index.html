<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>金庸群侠传</title>
  <link rel="stylesheet" href="../fmj/guide.css">
  <link rel="stylesheet" href="../fmj/choice.css">
  <style>
    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden;
      background: #000; touch-action: none;
    }
    body { display: flex; align-items: center; justify-content: center; }
    #lcd {
      width: 100%; height: 100%; object-fit: contain;
      image-rendering: pixelated; background: #d8d8cf;
    }
  </style>
  <script src="js/storage.js"></script>
  <script src="../fmj/js/preferences.js"></script>
  <script src="../fmj/js/jquery.min.js"></script>
  <script src="../fmj/js/encoding-indexes.js"></script>
  <script src="../fmj/js/encoding.js"></script>
  <script src="../fmj/js/hd-renderer.js"></script>
  <script src="../fmj/js/sys.js"></script>
  <script>JyqxzStorage.install();</script>
  <script src="../fmj/js/kotlin.js"></script>
  <script src="../fmj/js/keyboard.js"></script>
  <script src="../fmj/js/font.js"></script>
  <script src="rom/rom.js"></script>
</head>
<body>
  <canvas id="lcd" width="480" height="288"></canvas>
  <script>
    (function configureFlutterHost() {
      window.bbkCheatState = {
        invincible: window.FmjPreferences.get('invincible'),
        oneHitKill: window.FmjPreferences.get('oneHitKill'),
        normalAttackAll: window.FmjPreferences.get('normalAttackAll'),
        firstAttack: false,
        attackPatchInstalled: false,
        speedPatchInstalled: false,
        monitorStarted: false
      };
      var randomBattleRestored = false;

      /**
       * 切换金庸群侠传显示画质。
       *
       * 该操作只替换最终帧的绘制方式，不改变游戏逻辑坐标、输入、作弊或存档数据。
       *
       * @param {boolean} enabled 是否启用三倍高清渲染。
       * @return {string} 供 Flutter WebView 安全解析的结构化结果。
       */
      window.bbkSetHighDefinition = function (enabled) {
        if (!window.FmjHdRenderer) {
          return JSON.stringify({ok: false, enabled: false});
        }
        window.FmjHdRenderer.setEnabled(!!enabled);
        return JSON.stringify({
          ok: true,
          enabled: window.FmjHdRenderer.isEnabled()
        });
      };

      /**
       * @return {string} 当前显示画质状态。
       */
      window.bbkGetGraphicsState = function () {
        return JSON.stringify({
          highDefinition: !!(
            window.FmjHdRenderer && window.FmjHdRenderer.isEnabled()
          )
        });
      };

      /**
       * 打开金庸群侠传原生存档档位界面。
       *
       * 快捷按钮只负责进入原有存档流程，不自动覆盖任何档位。引擎自身仍负责档位选择、
       * 覆盖确认以及剧情、战斗等不可存档状态的限制。
       *
       * @return {string} 供 Flutter WebView 安全解析的结构化结果。
       */
      window.bbkOpenSaveMenu = function () {
        function result(ok, message) {
          return JSON.stringify({ok: ok, message: message});
        }

        try {
          var core = window['fmj.core'] && window['fmj.core'].fmj;
          if (!core || !core.game || !core.game.mainScene) {
            return result(false, '请先开始或载入游戏');
          }
          if (core.Global.disableSave) {
            return result(false, '当前剧情不能存档');
          }
          if (
            core.game.mainScene.scriptProcess &&
            core.game.mainScene.scriptProcess.prev != null
          ) {
            return result(false, '副本中不能存档');
          }
          if (
            core.combat &&
            core.combat.Combat &&
            core.combat.Combat.Companion.IsActive()
          ) {
            return result(false, '战斗中不能存档');
          }

          var currentScreen = core.game.getCurScreen();
          if (!currentScreen) {
            return result(false, '当前界面不能存档');
          }

          var node = currentScreen;
          var inMainScene = false;
          var saveMenuOpened = false;
          for (var depth = 0; node && depth < 12; depth++) {
            if (node instanceof core.scene.ScreenMainGame) inMainScene = true;
            if (node instanceof core.views.ScreenSaveLoadGame) {
              saveMenuOpened = true;
              break;
            }
            var parent = node.parent;
            if (!parent || parent === node) break;
            node = parent;
          }
          if (saveMenuOpened) {
            return result(false, '存档界面已经打开');
          }
          if (!inMainScene) {
            return result(false, '请先进入游戏主场景');
          }

          var saveScreen = new core.views.ScreenSaveLoadGame(
            currentScreen,
            core.views.ScreenSaveLoadGame.Operate.SAVE,
            1
          );
          currentScreen.pushScreen_2o7n0o$(saveScreen);
          return result(true, '请选择存档位置');
        } catch (_) {
          return result(false, '当前界面不能存档，请回到主场景后重试');
        }
      };

      function ensureCheatMonitor(core) {
        if (!window.bbkCheatState.attackPatchInstalled) {
          var prototype = core.characters.FightingCharacter.prototype;
          var originalHasAtbuff = prototype.hasAtbuff_za3lpa$;
          prototype.hasAtbuff_za3lpa$ = function (mask) {
            if (
              window.bbkCheatState.normalAttackAll &&
              mask === core.characters.FightingCharacter.Companion.BUFF_MASK_ALL &&
              this instanceof core.characters.Player
            ) {
              return true;
            }
            return originalHasAtbuff.call(this, mask);
          };
          window.bbkCheatState.attackPatchInstalled = true;
        }
        if (!window.bbkCheatState.speedPatchInstalled) {
          var speedBackup = new WeakMap();
          var combatPrototype = core.combat.Combat.prototype;
          var originalSort = combatPrototype.sortActionQueue_0;
          combatPrototype.sortActionQueue_0 = function () {
            var active = window.bbkCheatState.invincible || window.bbkCheatState.oneHitKill || window.bbkCheatState.normalAttackAll;
            window.bbkCheatState.firstAttack = active;
            this.mPlayerList_0.toArray().forEach(function (player) {
              if (active) {
                if (!speedBackup.has(player)) speedBackup.set(player, player.speed);
                player.speed = Math.max(player.speed, 100000);
              } else if (speedBackup.has(player)) {
                player.speed = speedBackup.get(player); speedBackup.delete(player);
              }
            });
            // 先手只作用于本轮排序，立即恢复人物实际身法，避免把临时数值写入存档。
            try { return originalSort.call(this); }
            finally { this.mPlayerList_0.toArray().forEach(function (player) { if (speedBackup.has(player)) { player.speed = speedBackup.get(player); speedBackup.delete(player); } }); }
          };
          window.bbkCheatState.speedPatchInstalled = true;
        }
        if (window.bbkCheatState.monitorStarted) return;
        window.bbkCheatState.monitorStarted = true;
        var cheatTimer = window.setInterval(function () {
          try {
            if (!window.bbkCheatState.invincible && !window.bbkCheatState.oneHitKill) return;
            var players = core.game.playerList.toArray();
            if (window.bbkCheatState.invincible) {
              players.forEach(function (player) {
                if (player.hp < player.maxHP) player.hp = player.maxHP;
              });
            }
            if (window.bbkCheatState.oneHitKill) {
              var combat = core.combat.Combat.Companion;
              var instance = combat.sInstance_0;
              if (combat.IsActive() && instance && instance.mMonsterList_0) {
                instance.mMonsterList_0.toArray().forEach(function (monster) {
                  if (monster.hp > 0 && monster.hp < monster.maxHP) monster.hp = 0;
                });
              }
            }
          } catch (_) {
            // 场景切换时列表可能短暂不可用，下一轮继续检查。
          }
        }, 20);
        window.addEventListener("pagehide", function () { window.clearInterval(cheatTimer); });
      }

      window.bbkExportState = function () { return JSON.stringify(Object.assign(JyqxzStorage.export(), FmjPreferences.export())); };

      window.bbkSendInput = function (action) {
        var keyMap = {
          up: 1, down: 2, left: 3, right: 4,
          pageUp: 5, pageDown: 6, confirm: 7, cancel: 8,
          search: 5, help: 6
        };
        if (keyMap[action] !== undefined) onKeyDown(keyMap[action]);
      };

      window.bbkApplyCheat = function (action) {
        function result(ok, message) {
          return JSON.stringify({ok: ok, message: message});
        }
        try {
          var core = window['fmj.core'] && window['fmj.core'].fmj;
          if (!core || !core.game) return result(false, '游戏引擎尚未就绪');
          ensureCheatMonitor(core);
          var players = core.game.playerList.toArray();
          if (!players.length) return result(false, '请先开始或载入一局游戏');

          if (action === 'fmj_invincible') {
            window.bbkCheatState.invincible = !window.bbkCheatState.invincible;
            window.FmjPreferences.set('invincible', window.bbkCheatState.invincible);
            return result(
              true,
              window.bbkCheatState.invincible ? '我方无敌已开启' : '我方无敌已关闭'
            );
          }
          if (action === 'fmj_one_hit_kill') {
            window.bbkCheatState.oneHitKill = !window.bbkCheatState.oneHitKill;
            window.FmjPreferences.set('oneHitKill', window.bbkCheatState.oneHitKill);
            return result(
              true,
              window.bbkCheatState.oneHitKill ? '一击必杀已开启' : '一击必杀已关闭'
            );
          }
          if (action === 'fmj_normal_attack_all') {
            window.bbkCheatState.normalAttackAll = !window.bbkCheatState.normalAttackAll;
            window.FmjPreferences.set('normalAttackAll', window.bbkCheatState.normalAttackAll);
            return result(
              true,
              window.bbkCheatState.normalAttackAll ? '普通攻击群攻已开启' : '普通攻击群攻已关闭'
            );
          }

          if (action === 'fmj_restore') {
            players.forEach(function (player) {
              player.hp = player.maxHP;
              player.mp = player.maxMP;
              player.debuff.reset();
            });
            return result(true, '全队生命、真气和状态已恢复');
          }
          if (action === 'fmj_money') {
            core.characters.Player.Companion.sMoney = Math.min(
              2147483647,
              core.characters.Player.Companion.sMoney + 100000
            );
            return result(true, '已增加 100000 金钱');
          }
          if (action === 'fmj_stats') {
            players.forEach(function (player) {
              player.maxHP = 999;
              player.maxMP = 999;
              player.hp = 999;
              player.mp = 999;
              player.attack = 999;
              player.defend = 999;
              player.speed = 99;
              player.lingli = 99;
              player.luck = 99;
            });
            return result(true, '全队主要属性已提升至上限');
          }
          if (action === 'fmj_level') {
            players.forEach(function (player) {
              player.levelUp_za3lpa$(player.levelupChain.maxLevel);
              if (player.magicChain) player.magicChain.learnNum = player.magicChain.magicSum_0;
              // 金庸没有 FMJ 成长法术链，原武学通过剧情学习。仅补本主角可学资源并去重。
              var known = new Set(player.getAllMagics().toArray().map(function (magic) { return magic.type + ':' + magic.index; }));
              window.FmjGuideData.skills.filter(function (skill) { return skill.actors.includes(player.index); }).forEach(function (skill) {
                if (known.has(skill.id)) return;
                var key = skill.id.split(':').map(Number), magic = core.lib.DatLib.Companion.getRes_2et8c9$(core.lib.DatLib.ResType.MRS, key[0], key[1], true);
                if (magic) player.learnMagic_3fncnk$(magic);
              });
              player.currentExp = 0;
            });
            var magicCount = players.reduce(function (count, player) { return count + player.getAllMagics().size; }, 0);
            return result(true, '全队已满级并学会本主角全部可学武功，共 ' + magicCount + ' 个');
          }
          if (action === 'fmj_master_key') {
            var bag = core.characters.Player.Companion.sGoodsList;
            for (var index = 1; index <= 41; index++) bag.addGoods_qt1dr2$(14, index, Math.max(0, 99 - bag.getGoodsNum_vux9f0$(14, index)));
            return result(true, '车票、银票和采集材料已补足 99 个');
          }
          if (action === 'jyqxz_all_goods') {
            var bag = core.characters.Player.Companion.sGoodsList;
            window.FmjGuideData.goods.forEach(function (item) { var key = item.id.split(':').map(Number); bag.addGoods_qt1dr2$(key[0], key[1], Math.max(0, 99 - bag.getGoodsNum_vux9f0$(key[0], key[1]))); });
            return result(true, '本 ROM 的全部装备、药物和材料已补足 99 个');
          }
          if (action === 'fmj_force_win') {
            var fight = core.combat.Combat.Companion, instance = fight.sInstance_0;
            if (!fight.IsActive() || !instance) return result(false, '当前没有进行中的战斗');
            instance.mMonsterList_0.toArray().forEach(function (monster) { monster.hp = 0; });
            if (instance.mCombatState_0.name === 'SelectAction' && !instance.mIsAutoAttack_0) instance.onAutoAttack();
            return result(true, '已提交当前战斗胜利，按原流程结算');
          }
          if (action === 'fmj_random_battle') {
            var combat = core.combat.Combat.Companion;
            combat.globalDisableFighting_0 = !combat.globalDisableFighting_0;
            window.FmjPreferences.set('randomBattleDisabled', combat.globalDisableFighting_0);
            return result(
              true,
              combat.globalDisableFighting_0 ? '随机战斗已关闭' : '随机战斗已开启'
            );
          }
          return result(false, '未知的作弊操作');
        } catch (_) {
          return result(false, '修改失败，请回到主场景后重试');
        }
      };

      window.bbkGetCheatState = function () {
        var core = window['fmj.core'] && window['fmj.core'].fmj;
        if (core && core.game) {
          if (!randomBattleRestored) {
            core.combat.Combat.Companion.globalDisableFighting_0 = window.FmjPreferences.get('randomBattleDisabled');
            randomBattleRestored = true;
          }
          ensureCheatMonitor(core);
        }
        window.bbkCheatState.firstAttack = window.bbkCheatState.invincible || window.bbkCheatState.oneHitKill || window.bbkCheatState.normalAttackAll;
        var randomBattleDisabled = !!(
          core && core.combat && core.combat.Combat.Companion.globalDisableFighting_0
        );
        return JSON.stringify({
          invincible: !!window.bbkCheatState.invincible,
          oneHitKill: !!window.bbkCheatState.oneHitKill,
          normalAttackAll: !!window.bbkCheatState.normalAttackAll,
          firstAttack: !!window.bbkCheatState.firstAttack,
          randomBattleDisabled: randomBattleDisabled
        });
      };

      window.bbkGetExplorationState = function () {
        try {
          var core = window['fmj.core'] && window['fmj.core'].fmj;
          var lamps = [];
          for (var eventId = 1001; eventId <= 1009; eventId++) {
            lamps.push(!!core.script.ScriptResources.globalEvents[eventId]);
          }
          var scene = core.game && core.game.mainScene;
          var map = scene && scene.currentMap;
          var player = scene && scene.player;
          if (!map || !player) {
            return JSON.stringify({lamps: lamps, map: null});
          }
          var cells = [];
          for (var y = 0; y < map.mapHeight; y++) {
            for (var x = 0; x < map.mapWidth; x++) {
              var offset = (y * map.mapWidth + x) * 2;
              var tile = map.mData_0[offset] & 255;
              var event = map.mData_0[offset + 1] & 255;
              cells.push(tile | (event << 8));
            }
          }
          return JSON.stringify({
            lamps: lamps,
            map: {
              id: map.type + ':' + map.index,
              type: map.type,
              index: map.index,
              name: map.mapName || '',
              sceneName: scene.sceneName || '',
              width: map.mapWidth,
              height: map.mapHeight,
              playerX: player.posInMap.x,
              playerY: player.posInMap.y,
              cells: cells
            }
          });
        } catch (_) {
          return JSON.stringify({lamps: [], map: null});
        }
      };
      document.addEventListener('keydown', function (event) {
        var browserKeyMap = {
          ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
          Enter: 'confirm', ' ': 'confirm', Escape: 'cancel',
          PageUp: 'pageUp', PageDown: 'pageDown'
        };
        var action = browserKeyMap[event.key];
        if (action) {
          event.preventDefault();
          window.bbkSendInput(action);
        }
      });

      window.sysExit = function () {
        if (window.BbkSystemChannel) window.BbkSystemChannel.postMessage('exit');
      };
    })();
  </script>
  <script src="../fmj/js/fmj.core.js"></script>
  <script src="js/compatibility.js"></script>
  <script src="../fmj/js/wide-view.js"></script>
  <script src="../fmj/js/wide-ui.js"></script>
  <script src="../fmj/js/fmj-auto-battle.js"></script>
  <script src="../fmj/js/choice-ui.js"></script>
  <script src="js/guide-data.js"></script>
  <script src="../fmj/js/guide-engine.js"></script>
  <script src="js/quests.js"></script>
  <script src="../fmj/js/guide-ui.js"></script>

  <script src="js/stages.js"></script>
  <script>
    window.bbkGetCheatState();
    window.FmjPreferences.flush();
    document.body.dataset.gameReady = 'true';
    window.addEventListener('pagehide', function () { sysSetGameLoopPaused(true); });
    if (window.BbkSystemChannel) window.BbkSystemChannel.postMessage('ready');
  </script>
</body>
</html>
