<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>三国霸业</title>
  <style>
    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden;
      background: #000; touch-action: none;
    }
    body { display: flex; align-items: center; justify-content: center; }
    #lcd {
      width: 100%; height: 100%; object-fit: contain;
      image-rendering: pixelated; background: #b4b4b4;
    }
  </style>
  <script>
    (function restoreFlutterBackup() {
      try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/__state__/sgby', false);
        xhr.send(null);
        if (xhr.status === 200) {
          var state = JSON.parse(xhr.responseText);
          Object.keys(state.entries || {}).forEach(function (key) {
            window.localStorage.setItem(key, state.entries[key]);
          });
        }
      } catch (_) {
        // WebView 自身的 localStorage 仍可继续使用。
      }
      if (!window.localStorage.getItem('baye/libpath')) {
        window.localStorage.setItem('baye/libpath', 'libs/dat-mod.lib');
        window.localStorage.setItem('baye/libname', '词典原版');
        window.localStorage.setItem('baye/resolution', '0');
      }
    })();
  </script>
  <script src="js/jquery.min.js"></script>
  <script src="js/encoding-indexes.js"></script>
  <script src="js/encoding.js"></script>
  <script src="js/sprintf.js"></script>
</head>
<body>
  <canvas id="lcd" width="640" height="384"></canvas>
  <script src="js/idbkvstore.min.js"></script>
  <script src="js/bridge.js"></script>
  <script src="js/lcd.js"></script>
  <script src="js/bbk-enhancements.js"></script>
  <script>
    (function configureFlutterHost() {
      function postEntries(entries) {
        if (window.BbkSaveChannel) {
          window.BbkSaveChannel.postMessage(JSON.stringify({entries: entries}));
        }
      }

      var originalSave = window.bayeSaveFileContent;
      window.bayeSaveFileContent = function (filename, content) {
        originalSave(filename, content);
        if (window.BbkSgby) window.BbkSgby.onSaveCompleted();
        var entries = {};
        entries[filename] = content;
        entries[filename + '.lib'] = window.localStorage[filename + '.lib'] || '';
        entries[filename + '.name'] = window.localStorage[filename + '.name'] || '';
        postEntries(entries);
      };

      window.bbkExportState = function () {
        var entries = {};
        for (var index = 0; index < window.localStorage.length; index++) {
          var key = window.localStorage.key(index);
          if (key && (key.indexOf('baye/') === 0 || key.indexOf('baye.') === 0)) {
            entries[key] = window.localStorage.getItem(key) || '';
          }
        }
        return JSON.stringify(entries);
      };

      window.bbkSendInput = function (action) {
        if (
          (action === 'endTurn' || action === 'battleInfo' || action === 'toggleBattleSpeed') &&
          window.BbkSgby
        ) {
          return window.BbkSgby.handleControl(action);
        }
        var keyMap = {
          up: VK_UP, down: VK_DOWN, left: VK_LEFT, right: VK_RIGHT,
          confirm: VK_ENTER, cancel: VK_EXIT,
          pageUp: VK_PGUP, pageDown: VK_PGDN,
          search: VK_SEARCH, help: VK_HELP
        };
        if (keyMap[action] !== undefined) sendKey(keyMap[action]);
        return null;
      };

      window.bbkOpenSaveMenu = function () {
        return window.BbkSgby
          ? window.BbkSgby.openSaveMenu()
          : JSON.stringify({ok: false, message: '游戏增强模块尚未加载'});
      };

      window.bbkApplyCheat = function (action, parameters) {
        return window.BbkSgby
          ? window.BbkSgby.applyCheat(action, parameters)
          : JSON.stringify({ok: false, message: '游戏增强模块尚未加载'});
      };

      window.bbkGetCheatState = function () {
        return window.BbkSgby ? window.BbkSgby.getCheatState() : '{}';
      };

      window.bbkGetSgbyCheatData = function () {
        return window.BbkSgby
          ? window.BbkSgby.getCheatData()
          : JSON.stringify({ok: false, message: '游戏增强模块尚未加载'});
      };
      document.addEventListener('keydown', onKeyDown);

      window.goHome = function () {
        if (window.BbkSystemChannel) window.BbkSystemChannel.postMessage('exit');
      };

      Module.postRun = function () {
        lcdInit();
        touchScreenInit('lcd');
        function startGame() {
          bayeMain();
          var remainingEnhancementChecks = 40;
          var prepareEnhancements = function () {
            var resourceReady = typeof dynLib !== 'undefined' && dynLib && dynLib.length;
            if (!baye.data && !resourceReady && remainingEnhancementChecks-- > 0) {
              window.setTimeout(prepareEnhancements, 250);
              return;
            }
            if (!baye.data && resourceReady && typeof _bayeScriptInit === 'function') {
              try {
                _bayeScriptInit();
              } catch (_) {
                // 数据桥属于增强能力，初始化失败时仍允许原游戏正常运行。
              }
            }
            if (window.BbkSgby) window.BbkSgby.start();
            document.body.dataset.gameReady = 'true';
            if (window.BbkSystemChannel) window.BbkSystemChannel.postMessage('ready');
          };
          window.setTimeout(prepareEnhancements, 100);
        }
        var libPath = window.localStorage.getItem('baye/libpath') || '';
        if (window.localStorage.getItem('baye/cachedLibPath') !== libPath) {
          libCacheClear(function () {
            window.localStorage.setItem('baye/cachedLibPath', libPath);
            startGame();
          });
        } else {
          startGame();
        }
      };
    })();
  </script>
  <script src="js/baye.js"></script>
</body>
</html>
